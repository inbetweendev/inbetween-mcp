name: Feature request
description: Something you want the MCP server to do that it doesn't.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: User-facing pain. What does the agent fail to do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: New tool? New event in the push? Be concrete.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
